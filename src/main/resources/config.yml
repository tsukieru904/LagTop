# LagTop configuration
# The score is an estimate. Paper does not expose per-chunk CPU time through the API.
scan-period-seconds: 15
chunks-per-scan: 8
initial-scan-delay-ticks: 20
activity-decay: 0.5
retention-seconds: 120

# How much each observed activity contributes to the estimated score.
weights:
  redstone-events: 1.0
  piston-events: 6.0
  hopper-moves: 3.0
  # Living entities (mobs, villagers, minecarts...) cost real tick time; weight them higher.
  living-entities: 0.50
  # Item drops / XP orbs are cheap to tick; weight them much lower so they don't dominate the ranking.
  passive-entities: 0.02
  redstone-blocks: 0.03
  pistons: 0.50
  hoppers: 0.35
  observers: 0.35
  # BlockRedstoneEvent fires on every power-level change and can itself become a lag source
  # if counted one-by-one. Only 1 in N events is recorded, then multiplied back up by N.
  redstone-sample-rate: 4

# Materials counted as redstone components.
# Names that do not exist on the running server are ignored.
redstone-materials:
  - REDSTONE_WIRE
  - REDSTONE_TORCH
  - REDSTONE_WALL_TORCH
  - REDSTONE_BLOCK
  - REPEATER
  - COMPARATOR
  - TARGET
  - LEVER
  - STONE_BUTTON
  - POLISHED_BLACKSTONE_BUTTON
  - OAK_BUTTON
  - SPRUCE_BUTTON
  - BIRCH_BUTTON
  - JUNGLE_BUTTON
